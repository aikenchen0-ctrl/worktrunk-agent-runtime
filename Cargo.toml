[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "本机多 Agent Worktree 运行时控制器"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/aikenchen0-ctrl/worktrunk-agent-runtime"
# 只发布控制器源文件与公开材料，禁止递归收集本机快照或凭证。
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/CHANGELOG.md", "/SECURITY.md", "/src/**", "/tests/**", "/scripts/**", "/skills/**", "/examples/**", "/docs/**"]

[[bin]]
name = "agentctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
