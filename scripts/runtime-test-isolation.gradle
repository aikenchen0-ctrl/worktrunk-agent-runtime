import org.gradle.api.tasks.testing.Test
import java.security.MessageDigest

def repository = System.getProperty('maven.repo.local')
if (!repository) { throw new GradleException('运行时未设置隔离 Maven 目录') }
def runtimeRoot = new File(repository).parentFile
def repositoryUrl = System.getenv('AGENT_TEST_MAVEN_URL')
if (repositoryUrl) {
    def uri = new URI(repositoryUrl)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
        throw new GradleException('测试依赖仓库必须是无凭证的 HTTPS 地址')
    }
}
gradle.beforeProject { project ->
    project.tasks.withType(Test).configureEach { test ->
        // 测试 JVM 不继承 Gradle 系统属性；单独隔离其 Maven 缓存、下载锁和临时目录。
        def identity = MessageDigest.getInstance('SHA-256').digest(test.path.getBytes('UTF-8'))
            .collect { String.format('%02x', it & 0xff) }.join('').substring(0, 20)
        def testHome = new File(runtimeRoot, 'test-jvm')
        def temporary = new File(testHome, "temp/${identity}")
        doFirst {
            if (!temporary.isDirectory() && !temporary.mkdirs()) {
                throw new GradleException('不能创建测试 JVM 隔离目录')
            }
            systemProperty 'maven.repo.local', repository
            systemProperty 'user.home', testHome.absolutePath
            systemProperty 'java.io.tmpdir', temporary.absolutePath
            environment 'TEMP', temporary.absolutePath
            environment 'TMP', temporary.absolutePath
            if (repositoryUrl) { systemProperty 'robolectric.dependency.repo.url', repositoryUrl }
        }
    }
}
